# Bundled Postgres and Redis, ingress with TLS: what the kind smoke test installs.
serverUrl: http://marmot.local
postgresql:
  enabled: true
redis:
  enabled: true
ingress:
  enabled: true
  host: marmot.local
  realtime:
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
