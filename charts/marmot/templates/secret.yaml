{{- include "marmot.validate" . }}
{{- if and (include "marmot.server" .) (not .Values.secrets.existingSecret) }}
{{- $name := include "marmot.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "marmot.labels" . | nindent 4 }}
type: Opaque
stringData:
  PAYLOAD_SECRET: {{ default (include "marmot.persistentRandom" (dict "ctx" $ "secret" $name "key" "PAYLOAD_SECRET" "length" 48)) .Values.secrets.payloadSecret | quote }}
  {{- if and .Values.secrets.databaseUrl (not .Values.postgresql.enabled) }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if and .Values.secrets.redisUrl (not .Values.redis.enabled) }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
