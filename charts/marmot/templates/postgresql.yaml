{{- if and (include "marmot.server" .) .Values.postgresql.enabled }}
{{- $name := include "marmot.postgresql.fullname" . }}
{{- $pg := .Values.postgresql }}
{{- if not $pg.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "marmot.componentLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
  annotations:
    # The data directory keeps the password it was initialised with; keep the Secret with it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $pg.passwordKey }}: {{ default (include "marmot.persistentRandom" (dict "ctx" $ "secret" $name "key" $pg.passwordKey "length" 32)) $pg.password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "marmot.componentLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "marmot.componentSelectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "marmot.componentLabels" (dict "ctx" $ "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "marmot.componentSelectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marmot.componentSelectorLabels" (dict "ctx" $ "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # uid/gid of the `postgres` user in the alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "marmot.postgresql.secretName" . }}
                  key: {{ $pg.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
