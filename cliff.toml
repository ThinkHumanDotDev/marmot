# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and the GitHub Release notes from Conventional Commits.
#   pnpm dlx git-cliff --tag v0.1.0 -o CHANGELOG.md   (scripts/release.sh does this for you)
#   pnpm dlx git-cliff --latest --strip header         (notes for the newest tag only)

[changelog]
header = """
# Changelog

All notable changes to Marmot are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). This file is generated by
[git-cliff](https://git-cliff.org) from Conventional Commits; edit `cliff.toml`, not this file.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits
  | filter(attribute="scope")
  | sort(attribute="scope") %}
- **{{ commit.scope }}:** {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{%- for commit in commits %}
{%- if not commit.scope %}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{%- endif %}
{%- endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/ThinkHumanDotDev/marmot/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/ThinkHumanDotDev/marmot/releases/tag/{{ release.version }}
{% endif -%}
{% elif release.previous.version -%}
[Unreleased]: https://github.com/ThinkHumanDotDev/marmot/compare/{{ release.previous.version }}...HEAD
{% else -%}
[Unreleased]: https://github.com/ThinkHumanDotDev/marmot/commits/main
{% endif -%}
{% endfor %}
"""
trim = false
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Link squash-merge PR numbers: "(#42)" -> "([#42](…/pull/42))".
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/ThinkHumanDotDev/marmot/pull/${1}))" },
]
# The HTML comments only order the groups; `striptags` removes them in the template.
commit_parsers = [
  { message = "^chore\\(release\\): v?[0-9]+\\.[0-9]+\\.[0-9]+\\S*$", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build and CI" },
  { message = "^chore|^style", group = "<!-- 8 -->Maintenance" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
