# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and the GitHub Release notes from Conventional Commits.
#   pnpm dlx git-cliff --tag v0.1.0 -o CHANGELOG.md   (scripts/release.sh does this for you)
#   pnpm dlx git-cliff --latest --strip header         (notes for the newest tag only)

[changelog]
# Release notes follow Uptime Kuma's layout (emoji sections, PR number first) with kan.bn's
# "Full Changelog" compare link. Marmot has a single maintainer, so there are no "Thanks @…" credits or
# "New Contributors" lists. Breaking changes (`feat!:` or a `BREAKING CHANGE:` footer) get a warning block
# at the top. A personal note or upgrade highlights go above the generated notes on the GitHub Release.
header = """
# Changelog

All notable changes to Marmot are documented here. Marmot uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). This file is generated by
[git-cliff](https://git-cliff.org) from Conventional Commits; edit `cliff.toml`, not this file.
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
> [!WARNING]
> This release contains breaking changes. Back up your database and read these before upgrading:
{% for commit in breaking %}
> - {{ commit.breaking_description | default(value=commit.message) | upper_first }}
{%- endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits
  | filter(attribute="scope")
  | sort(attribute="scope") %}
- **{{ commit.scope }}:** {{ commit.message | upper_first }}
{%- endfor %}
{%- for commit in commits %}
{%- if not commit.scope %}
- {{ commit.message | upper_first }}
{%- endif %}
{%- endfor %}
{% endfor %}
{% if version and previous.version -%}
**Full Changelog**: https://github.com/ThinkHumanDotDev/marmot/compare/{{ previous.version }}...{{ version }}
{% elif version -%}
**Full Changelog**: https://github.com/ThinkHumanDotDev/marmot/commits/{{ version }}
{% endif -%}
"""
footer = ""
trim = false
# Move the squash-merge PR link to the front of the line, Uptime Kuma style:
#   "- **ui:** Members … ([#44](…))" -> "- [#44](…) **ui:** Members …"
postprocessors = [
  { pattern = '(?m)^- (.*) \(\[#(\d+)\]\(([^)]+)\)\)$', replace = "- [#${2}](${3}) ${1}" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Link squash-merge PR numbers: "(#42)" -> "([#42](…/pull/42))".
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/ThinkHumanDotDev/marmot/pull/${1}))" },
]
# The HTML comments only order the groups; `striptags` removes them in the template. Use the `security`
# scope (`fix(security): …`) or reference a CVE/GHSA id to land a commit under Security Fixes.
commit_parsers = [
  # Subject line only: the squash merge appends the (expanded) PR link and the PR body.
  { message = "^chore\\(release\\): v?[0-9]+\\.[0-9]+\\.[0-9]+\\S*( \\(.*\\))?(\n|$)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[a-z]+\\(security\\)|CVE-[0-9]|GHSA-", group = "<!-- 4 -->⬆️ Security Fixes" },
  { message = "^feat", group = "<!-- 1 -->🆕 New Features" },
  { message = "^perf", group = "<!-- 2 -->💇‍♀️ Improvements" },
  { message = "^fix", group = "<!-- 3 -->🐞 Bug Fixes" },
  { message = "^docs", group = "<!-- 5 -->📝 Documentation" },
  { message = ".*", group = "<!-- 6 -->Others" },
]

