name: Release

# Pushing a tag `vX.Y.Z` (or a prerelease such as `vX.Y.Z-rc.1`) publishes the multi-arch image to GHCR,
# smoke-tests the published image with the production compose stack and creates the GitHub Release with
# git-cliff notes. Prepare the tag with `pnpm release:prepare <version>`; see docs/Release-Checklist.md.

on:
  push:
    tags: ['v*.*.*']
  # Re-run the release for an existing tag with this workflow from the default branch, e.g. when the tag's
  # own release run failed for a reason fixed since (the tag stays where it is).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
  # Pull requests that change this workflow build both platforms without pushing anything.
  pull_request:
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thinkhumandotdev/marmot
  TAG: ${{ inputs.tag || github.ref_name }}
  # Empty (the event's own ref) except for a manual run, which checks out the tag it releases.
  CHECKOUT_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      json: ${{ steps.meta.outputs.json }}
      labels: ${{ steps.meta.outputs.labels }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      github-prerelease: ${{ steps.version.outputs.github-prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Check tag against package.json
        id: version
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::${TAG} is not a release tag (vX.Y.Z)"
            exit 1
          fi
          tag="${TAG#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${pkg} (run pnpm release:prepare)"
            exit 1
          fi
          # `prerelease` (an -rc/-beta tag) decides the image tags. The GitHub Release is also marked as a
          # prerelease for every 0.x version: Marmot is pre-release until v1.0.
          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          github_prerelease="$prerelease"
          case "$tag" in
            0.*) github_prerelease=true ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "github-prerelease=${github_prerelease}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Put the OCI annotations on the multi-arch index as well as on each platform manifest.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added explicitly below, only for final (non-prerelease) versions.
          flavor: |
            latest=false
          # 0.1.0 and 0.1 for a final release; prereleases (0.2.0-rc.1) only get their full version,
          # because metadata-action skips the {{major}}.{{minor}} pattern for prerelease tags. `value` makes
          # a manual run (whose ref is the default branch) tag the release it was given.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          # The revision is the checked-out tag's commit, not the commit the workflow ran from.
          labels: |
            org.opencontainers.image.title=Marmot
            org.opencontainers.image.description=Self-hosted status monitor with team workspaces, built on Payload CMS
            org.opencontainers.image.vendor=ThinkHumanDotDev
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.documentation=https://github.com/ThinkHumanDotDev/marmot/blob/main/docs/Deployment.md
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=Marmot
            org.opencontainers.image.description=Self-hosted status monitor with team workspaces, built on Payload CMS
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

  # Each platform builds on a native runner (an emulated arm64 build took over an hour) and is pushed by
  # digest only; the `image` job joins the two digests into the tagged multi-arch index.
  build:
    name: Build image (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Platform manifest annotations
        id: annotations
        env:
          META_JSON: ${{ needs.prepare.outputs.json }}
        run: |
          {
            echo 'list<<EOF'
            jq -r '.annotations[] | select(startswith("manifest:"))' <<< "$META_JSON"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          annotations: ${{ steps.annotations.outputs.list }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          # linux/amd64 can reuse CI's cache of main (scope=ci). Each platform writes its own scope, and
          # pull requests write none, so CI's cache is never evicted.
          cache-from: |
            type=gha,scope=release-${{ matrix.arch }}
            type=gha,scope=ci
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,scope=release-{0},mode=max', matrix.arch) || '' }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Publish image (linux/amd64, linux/arm64)
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
      github-prerelease: ${{ needs.prepare.outputs.github-prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ needs.prepare.outputs.json }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$META_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[] | select(startswith("index:"))' <<< "$META_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.version }}"
      - name: Summary
        env:
          META_JSON: ${{ needs.prepare.outputs.json }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            jq -r '.tags[]' <<< "$META_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test published image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      MARMOT_VERSION: ${{ needs.image.outputs.version }}
      COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml
      PAYLOAD_SECRET: release-smoke-secret-release-smoke-secret
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The package is private until its visibility is changed in GHCR; logging in works either way.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the multi-arch manifest
        run: |
          set -euxo pipefail
          docker buildx imagetools inspect "$IMAGE:$MARMOT_VERSION" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
      - name: Prepare compose .env
        run: |
          sed -e "s#^PAYLOAD_SECRET=.*#PAYLOAD_SECRET=${PAYLOAD_SECRET}#" \
              -e "s#^NEXT_PUBLIC_SERVER_URL=.*#NEXT_PUBLIC_SERVER_URL=http://localhost:8080#" \
              docker/.env.example > docker/.env
      - name: Pull the published image through compose
        run: |
          set -euxo pipefail
          $COMPOSE config --images | grep -Fx "$IMAGE:$MARMOT_VERSION"
          $COMPOSE pull --quiet
      - name: Compose smoke test (postgres, web + worker + realtime + caddy)
        run: scripts/smoke-test.sh compose
      - name: Single-container smoke test (MARMOT_ROLE=all, clean shutdown)
        run: scripts/smoke-test.sh single "$IMAGE:$MARMOT_VERSION"
      - name: Container logs
        if: failure()
        run: scripts/smoke-test.sh logs
      - name: Tear down
        if: always()
        run: scripts/smoke-test.sh down

  release:
    name: GitHub Release
    needs: [image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Add image reference
        env:
          VERSION: ${{ needs.image.outputs.version }}
        # Insert the image block above the closing "**Full Changelog**" line so that link stays last.
        run: |
          grep -v '^\*\*Full Changelog\*\*' RELEASE_NOTES.md > notes.body || true
          grep '^\*\*Full Changelog\*\*' RELEASE_NOTES.md > notes.footer || true
          {
            cat notes.body
            echo '### Container image'
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo 'Multi-arch (linux/amd64, linux/arm64). Upgrade guide: [docs/Deployment.md](https://github.com/ThinkHumanDotDev/marmot/blob/main/docs/Deployment.md#upgrading).'
            echo
            cat notes.footer
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.image.outputs.github-prerelease }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" "${flags[@]}"
