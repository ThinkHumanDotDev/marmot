name: Release

# Pushing a tag `vX.Y.Z` (or a prerelease such as `vX.Y.Z-rc.1`) publishes the multi-arch image to GHCR,
# smoke-tests the published image with the production compose stack and creates the GitHub Release with
# git-cliff notes. Prepare the tag with `pnpm release:prepare <version>`; see docs/Release-Checklist.md.

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thinkhumandotdev/marmot

jobs:
  image:
    name: Publish image (linux/amd64, linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      github-prerelease: ${{ steps.version.outputs.github-prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} (run pnpm release:prepare)"
            exit 1
          fi
          # `prerelease` (an -rc/-beta tag) decides the image tags. The GitHub Release is also marked as a
          # prerelease for every 0.x version: Marmot is pre-release until v1.0.
          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          github_prerelease="$prerelease"
          case "$tag" in
            0.*) github_prerelease=true ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "github-prerelease=${github_prerelease}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Put the OCI annotations on the multi-arch index as well as on each platform manifest.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # `latest` is added explicitly below, only for final (non-prerelease) versions.
          flavor: |
            latest=false
          # 0.1.0 and 0.1 for a final release; prereleases (0.2.0-rc.1) only get their full version,
          # because metadata-action skips the {{major}}.{{minor}} pattern for prerelease tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Marmot
            org.opencontainers.image.description=Self-hosted status monitor with team workspaces, built on Payload CMS
            org.opencontainers.image.vendor=ThinkHumanDotDev
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.documentation=https://github.com/ThinkHumanDotDev/marmot/blob/main/docs/Deployment.md
          annotations: |
            org.opencontainers.image.title=Marmot
            org.opencontainers.image.description=Self-hosted status monitor with team workspaces, built on Payload CMS
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The linux/amd64 layers can come from CI's cache of main (scope=ci); this build only writes
          # its own scope so it never evicts CI's cache.
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci
          cache-to: type=gha,scope=release,mode=max
      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test published image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      MARMOT_VERSION: ${{ needs.image.outputs.version }}
      COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml
      PAYLOAD_SECRET: release-smoke-secret-release-smoke-secret
    steps:
      - uses: actions/checkout@v7
      # The package is private until its visibility is changed in GHCR; logging in works either way.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the multi-arch manifest
        run: |
          set -euxo pipefail
          docker buildx imagetools inspect "$IMAGE:$MARMOT_VERSION" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
      - name: Prepare compose .env
        run: |
          sed -e "s#^PAYLOAD_SECRET=.*#PAYLOAD_SECRET=${PAYLOAD_SECRET}#" \
              -e "s#^NEXT_PUBLIC_SERVER_URL=.*#NEXT_PUBLIC_SERVER_URL=http://localhost:8080#" \
              docker/.env.example > docker/.env
      - name: Pull the published image through compose
        run: |
          set -euxo pipefail
          $COMPOSE config --images | grep -Fx "$IMAGE:$MARMOT_VERSION"
          $COMPOSE pull --quiet
      - name: Compose smoke test (postgres, web + worker + realtime + caddy)
        run: scripts/smoke-test.sh compose
      - name: Single-container smoke test (MARMOT_ROLE=all, clean shutdown)
        run: scripts/smoke-test.sh single "$IMAGE:$MARMOT_VERSION"
      - name: Container logs
        if: failure()
        run: scripts/smoke-test.sh logs
      - name: Tear down
        if: always()
        run: scripts/smoke-test.sh down

  release:
    name: GitHub Release
    needs: [image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Add image reference
        env:
          VERSION: ${{ needs.image.outputs.version }}
        # Insert the image block above the closing "**Full Changelog**" line so that link stays last.
        run: |
          grep -v '^\*\*Full Changelog\*\*' RELEASE_NOTES.md > notes.body || true
          grep '^\*\*Full Changelog\*\*' RELEASE_NOTES.md > notes.footer || true
          {
            cat notes.body
            echo '### Container image'
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo 'Multi-arch (linux/amd64, linux/arm64). Upgrade guide: [docs/Deployment.md](https://github.com/ThinkHumanDotDev/marmot/blob/main/docs/Deployment.md#upgrading).'
            echo
            cat notes.footer
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.image.outputs.github-prerelease }}
        run: |
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
