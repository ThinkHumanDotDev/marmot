name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  REDIS_URL: redis://localhost:6379
  NEXT_TELEMETRY_DISABLED: 1
  PAYLOAD_TELEMETRY_DISABLED: 1

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm generate:types
        env:
          DATABASE_ADAPTER: sqlite
          DATABASE_URL: file:./data/ci.db
      - run: pnpm typecheck

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mongodb]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marmot
          POSTGRES_PASSWORD: marmot
          POSTGRES_DB: marmot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marmot" --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADAPTER: ${{ matrix.db }}
      # E2E runs against a migrated production-mode database; integration tests push their own schema
      # into a separate database so `payload migrate` never sees a dev-pushed schema.
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://marmot:marmot@localhost:5432/marmot' || 'mongodb://localhost:27017/marmot' }}
      INT_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://marmot:marmot@localhost:5432/marmot_test' || 'mongodb://localhost:27017/marmot_test' }}
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create integration test database
        if: matrix.db == 'postgres'
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE marmot_test'
      - name: Integration tests
        run: pnpm test:int --reporter=default --reporter=junit --outputFile=test-results/int-junit.xml
        env:
          DATABASE_URL: ${{ env.INT_DATABASE_URL }}
      - name: Build
        run: pnpm build
      - name: Run migrations
        run: pnpm migrate --force-accept-warning
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        env:
          E2E_WEB_COMMAND: pnpm start
      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test results (${{ matrix.db }})
          path: test-results/*-junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.db }}
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image & compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml
      # The workflow-level REDIS_URL/DATABASE_URL target the runner's localhost services; compose
      # interpolates `${REDIS_URL:-...}` from the shell, so blank them here to use the in-stack defaults.
      REDIS_URL: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare compose .env
        run: |
          sed -e "s#^PAYLOAD_SECRET=.*#PAYLOAD_SECRET=${PAYLOAD_SECRET}#" \
              -e "s#^NEXT_PUBLIC_SERVER_URL=.*#NEXT_PUBLIC_SERVER_URL=http://localhost:8080#" \
              docker/.env.example > docker/.env
      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.mongo.yml config -q
          docker compose -f docker/docker-compose.dev.yml config -q
          $COMPOSE config -q
      - name: Validate Caddyfile
        run: |
          validate() {
            docker run --rm -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" "$@" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate -e SITE_ADDRESS=:80 -e ACME_EMAIL=
          validate -e SITE_ADDRESS=status.example.com -e ACME_EMAIL=
          validate -e SITE_ADDRESS=status.example.com -e ACME_EMAIL=ops@example.com
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: marmot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        run: |
          bytes=$(docker image inspect marmot:ci --format '{{.Size}}')
          human=$(numfmt --to=iec-i --suffix=B "$bytes")
          echo "marmot:ci image size: $human ($bytes bytes)"
          {
            echo "### Docker image"
            echo
            echo "| Image | Size |"
            echo "| --- | --- |"
            echo "| \`marmot:ci\` | $human ($bytes bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compose smoke test (postgres, web + worker + realtime + caddy)
        run: |
          set -euxo pipefail
          $COMPOSE up -d --wait --wait-timeout 240
          # web, through Caddy
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/health | grep -q '"ok":true'
          # realtime health, direct
          curl -fsS http://localhost:3001/healthz | grep -q '"ok":true'
          # socket.io route through Caddy reaches the realtime process (polling handshake returns a sid)
          curl -fsS 'http://localhost:8080/socket.io/?EIO=4&transport=polling' | grep -q '"sid"'
          # security headers from next.config.ts
          curl -fsSI http://localhost:8080/api/health | tr -d '\r' | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://localhost:8080/api/health | tr -d '\r' | grep -qi '^strict-transport-security:'
          # worker booted against the database (it waits for migrations, so allow up to 90s)
          for i in $(seq 1 30); do
            $COMPOSE logs worker | grep -q 'worker booted' && break
            [ "$i" -eq 30 ] && { echo 'worker did not boot in time'; $COMPOSE logs worker; exit 1; }
            sleep 3
          done
          # the image healthcheck used by compose/orchestrators
          $COMPOSE exec -T web /app/entrypoint.sh healthcheck
          $COMPOSE exec -T realtime /app/entrypoint.sh healthcheck
      - name: Single-container smoke test (MARMOT_ROLE=all, clean shutdown)
        run: |
          set -euxo pipefail
          docker run -d --name marmot-all --network marmot_default -p 3100:3000 -p 3101:3001 \
            -e MARMOT_ROLE=all -e PAYLOAD_SECRET -e NEXT_PUBLIC_SERVER_URL=http://localhost:3100 \
            -e DATABASE_URL=postgres://marmot:marmot@postgres:5432/marmot -e REDIS_URL=redis://redis:6379 \
            marmot:ci
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors http://localhost:3100/api/health | grep -q '"ok":true'
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3101/healthz | grep -q '"ok":true'
          docker exec marmot-all /app/entrypoint.sh healthcheck
          docker stop -t 30 marmot-all
          test "$(docker inspect marmot-all --format '{{.State.ExitCode}}')" = "0"
      - name: Container logs
        if: failure()
        run: |
          docker logs marmot-all 2>&1 | tail -n 100 || true
          $COMPOSE ps -a || true
          $COMPOSE logs --no-color --tail=150 || true
      - name: Tear down
        if: always()
        run: |
          docker rm -f marmot-all >/dev/null 2>&1 || true
          $COMPOSE down -v --remove-orphans || true
