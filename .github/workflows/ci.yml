name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  REDIS_URL: redis://localhost:6379
  NEXT_TELEMETRY_DISABLED: 1
  PAYLOAD_TELEMETRY_DISABLED: 1

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (advisory; see docs/Security.md)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm generate:types
        env:
          DATABASE_ADAPTER: sqlite
          DATABASE_URL: file:./data/ci.db
      - run: pnpm typecheck

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mongodb]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marmot
          POSTGRES_PASSWORD: marmot
          POSTGRES_DB: marmot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marmot" --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADAPTER: ${{ matrix.db }}
      # E2E runs against a migrated production-mode database; integration tests push their own schema
      # into a separate database so `payload migrate` never sees a dev-pushed schema.
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://marmot:marmot@localhost:5432/marmot' || 'mongodb://localhost:27017/marmot' }}
      INT_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://marmot:marmot@localhost:5432/marmot_test' || 'mongodb://localhost:27017/marmot_test' }}
      # Inlined into the client bundle at build time: the browser talks to the realtime process
      # directly (no Caddy in CI). Must match the ports in tests/e2e/e2e-env.ts.
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create integration test database
        if: matrix.db == 'postgres'
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE marmot_test'
      - name: Integration tests
        run: pnpm test:int --reporter=default --reporter=junit --outputFile=test-results/int-junit.xml
        env:
          DATABASE_URL: ${{ env.INT_DATABASE_URL }}
      - name: Build
        run: pnpm build
      # Same bundled runner as the container (scripts/build-server.mjs): `payload migrate` loads the
      # config through tsx, whose import intermittently never settles and exits 0 having run nothing.
      - name: Run migrations
        run: pnpm build:server && pnpm migrate:prod --force-accept-warning
        timeout-minutes: 5
        env:
          NODE_ENV: production
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        timeout-minutes: 10
        env:
          # Production builds of web, worker and realtime against the migrated database; the bundled
          # reset script (tests/e2e/support/reset-db.ts) must not dev-push the schema either.
          NODE_ENV: production
          E2E_WEB_COMMAND: pnpm start
      # Check runs are created by .github/workflows/test-report.yml (workflow_run), which also works
      # for pull requests from forks, where this workflow's token cannot write checks.
      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.db }}
          path: test-results/*-junit.xml
          retention-days: 7
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.db }}
          path: |
            playwright-report
            test-results/e2e
          retention-days: 7

  docker:
    name: Docker image & compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml -f docker/docker-compose.ci.yml
      # The workflow-level REDIS_URL/DATABASE_URL target the runner's localhost services; compose
      # interpolates `${REDIS_URL:-...}` from the shell, so blank them here to use the in-stack defaults.
      REDIS_URL: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare compose .env
        run: |
          sed -e "s#^PAYLOAD_SECRET=.*#PAYLOAD_SECRET=${PAYLOAD_SECRET}#" \
              -e "s#^NEXT_PUBLIC_SERVER_URL=.*#NEXT_PUBLIC_SERVER_URL=http://localhost:8080#" \
              docker/.env.example > docker/.env
      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.mongo.yml config -q
          docker compose -f docker/docker-compose.dev.yml config -q
          $COMPOSE config -q
      - name: Validate Caddyfile
        run: |
          validate() {
            docker run --rm -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" "$@" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate -e SITE_ADDRESS=:80 -e ACME_EMAIL=
          validate -e SITE_ADDRESS=status.example.com -e ACME_EMAIL=
          validate -e SITE_ADDRESS=status.example.com -e ACME_EMAIL=ops@example.com
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: marmot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        run: |
          bytes=$(docker image inspect marmot:ci --format '{{.Size}}')
          human=$(numfmt --to=iec-i --suffix=B "$bytes")
          echo "marmot:ci image size: $human ($bytes bytes)"
          {
            echo "### Docker image"
            echo
            echo "| Image | Size |"
            echo "| --- | --- |"
            echo "| \`marmot:ci\` | $human ($bytes bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compose smoke test (postgres, web + worker + realtime + caddy)
        run: scripts/smoke-test.sh compose
      - name: Single-container smoke test (MARMOT_ROLE=all, clean shutdown)
        run: scripts/smoke-test.sh single marmot:ci
      - name: Container logs
        if: failure()
        run: scripts/smoke-test.sh logs
      - name: Tear down
        if: always()
        run: scripts/smoke-test.sh down
