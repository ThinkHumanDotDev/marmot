name: Bug report
description: Something is broken or behaves differently from the documentation
title: 'bug: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first and do **not** report security
        vulnerabilities here; use the private process in `.github/SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you see? Include the exact error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an HTTP monitor with …
        2. Wait for the first heartbeat
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marmot version or commit
      description: Image tag (`docker compose images`) or `git rev-parse HEAD` when running from source.
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database adapter
      options:
        - postgres
        - mongodb
        - sqlite (development)
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker compose (bundled Caddy)
        - Docker compose behind another reverse proxy
        - Docker image without compose / Kubernetes
        - From source (pnpm dev / pnpm start)
  - type: dropdown
    id: role
    attributes:
      label: Affected process
      multiple: true
      options:
        - web (UI, API, status pages)
        - worker (checks, notifications)
        - realtime (live updates)
        - all (single container)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs web worker realtime` (or the terminal). Redact secrets.
      render: shell
  - type: input
    id: browser
    attributes:
      label: Browser (for UI issues)
      placeholder: Firefox 131 on macOS
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets (PAYLOAD_SECRET, tokens, passwords) from everything above.
          required: true
