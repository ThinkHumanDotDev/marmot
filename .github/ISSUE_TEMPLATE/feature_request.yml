name: Feature request
description: Propose a feature or improvement
title: 'feat: '
labels: ['type:feat']
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/Comparison.md` first: many Uptime Kuma features are already planned or landing. If the
        request is "port provider X" or "port monitor type Y", say so; those are one-file changes and good
        first contributions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Proposed solution
      description: What should Marmot do, and for whom (viewer, member, admin, operator)?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of verifiable outcomes.
      placeholder: |
        - A member can …
        - The status page shows …
        - Works on Postgres and MongoDB
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - monitors / monitor types
        - notifications / providers
        - status pages
        - maintenance
        - organizations, members, auth
        - deployment / docker
        - API / integrations
        - UI / UX
        - documentation
        - other
  - type: textarea
    id: notes
    attributes:
      label: References and implementation notes
      description: Uptime Kuma or kan.bn equivalents, files involved, constraints, alternatives considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I am willing to open a pull request for this.
