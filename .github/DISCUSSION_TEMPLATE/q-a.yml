# Form for the "Q&A" category. The file name must match the category slug (`q-a`).
title: '[Q&A] '
body:
  - type: markdown
    attributes:
      value: |
        Ask how to deploy, configure or use Marmot. Search existing discussions and the
        [documentation](https://github.com/ThinkHumanDotDev/marmot/blob/main/docs/Home.md) first.
        Found a bug? Open an [issue](https://github.com/ThinkHumanDotDev/marmot/issues/new/choose) instead.
        Never post vulnerabilities here; follow `.github/SECURITY.md`.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what happens instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marmot version or commit
      description: Image tag (`docker compose images`) or `git rev-parse HEAD` when running from source.
  - type: dropdown
    id: db
    attributes:
      label: Database adapter
      options:
        - postgres
        - mongodb
        - sqlite (development)
        - not running yet
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker compose (bundled Caddy)
        - Docker compose behind another reverse proxy
        - Docker image without compose / Kubernetes
        - From source (pnpm dev / pnpm start)
        - Other / not deployed yet
  - type: textarea
    id: logs
    attributes:
      label: Relevant configuration and logs
      description: Redact secrets (`PAYLOAD_SECRET`, passwords, tokens) before pasting.
      render: shell
