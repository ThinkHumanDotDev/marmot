# CI override: run the stack from the locally built image (`marmot:ci`) instead of pulling from GHCR.
# Ports for the smoke test come from docker-compose.smoke.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.smoke.yml \
#     -f docker/docker-compose.ci.yml up -d --wait
x-ci-image: &ci-image
  image: marmot:ci
  pull_policy: never

services:
  web:
    <<: *ci-image
  worker:
    <<: *ci-image
  realtime:
    <<: *ci-image
