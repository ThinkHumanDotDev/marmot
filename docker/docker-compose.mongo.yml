# Override to run Marmot on MongoDB instead of Postgres:
#   docker compose -f docker-compose.yml -f docker-compose.mongo.yml up -d
# (The environment maps merge with docker-compose.yml; depends_on is replaced so Postgres is not required.)
x-mongo-env: &mongo-env
  DATABASE_ADAPTER: mongodb
  DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/marmot}

x-mongo-deps: &mongo-deps
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  web:
    environment: *mongo-env
    depends_on: !override
      <<: *mongo-deps
  worker:
    environment: *mongo-env
    depends_on: !override
      <<: *mongo-deps
  realtime:
    environment: *mongo-env
    depends_on: !override
      <<: *mongo-deps

  # Postgres is not started in this variant.
  postgres:
    profiles: ['disabled']

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo:
